<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar | Capivara Online</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="assets/logo-mark.png">
<link rel="stylesheet" href="assets/style.css?v=3">
<script src="assets/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
.auth-wrap {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px 20px;
  background: linear-gradient(160deg, var(--brand-900) 0%, var(--slate-900) 60%, var(--ink) 100%);
}
.auth-card {
  width: 100%;
  max-width: 420px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-xl);
  box-shadow: var(--sh-lg);
  overflow: hidden;
}
.auth-head {
  text-align: center;
  padding: 32px 32px 0;
}
.auth-logo {
  width: 56px; height: 56px;
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent-600) 100%);
  border-radius: 16px;
  display: grid; place-items: center;
  margin: 0 auto 16px;
  box-shadow: var(--sh-glow);
}
.auth-logo svg { width: 28px; height: 28px; stroke: #fff; }
.auth-head h1 { font-size: 22px; color: var(--text); margin-bottom: 6px; }
.auth-head p  { font-size: 14px; color: var(--text-soft); }

.auth-tabs {
  display: flex;
  border-bottom: 1px solid var(--border);
  margin-top: 24px;
}
.auth-tab {
  flex: 1;
  padding: 12px;
  font-size: 14px;
  font-weight: 600;
  color: var(--text-soft);
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  cursor: pointer;
  transition: color .15s, border-color .15s;
}
.auth-tab.is-active {
  color: var(--accent);
  border-bottom-color: var(--accent);
}

.auth-body { padding: 28px 32px 32px; }

.auth-field { margin-bottom: 16px; }
.auth-field label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 6px;
}
.auth-field input {
  width: 100%;
  padding: 12px 14px;
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  font-size: 15px;
  background: var(--slate-050);
  color: var(--text);
  transition: border-color .15s, box-shadow .15s;
  outline: none;
}
.auth-field input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(232,83,31,.12);
  background: var(--surface);
}

.auth-submit {
  width: 100%;
  padding: 13px;
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent-600) 100%);
  color: #fff;
  border: none;
  border-radius: var(--r-md);
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  transition: opacity .15s;
  margin-top: 4px;
}
.auth-submit:hover { opacity: .92; }
.auth-submit:disabled { opacity: .5; cursor: default; }

.auth-error {
  background: rgba(239,68,68,.08);
  border: 1px solid rgba(239,68,68,.25);
  border-radius: var(--r-md);
  color: #b91c1c;
  font-size: 13px;
  padding: 10px 14px;
  margin-bottom: 16px;
  display: none;
}
.auth-footer {
  text-align: center;
  padding: 0 32px 24px;
  font-size: 13px;
  color: var(--text-soft);
}
.auth-footer a { color: var(--accent); font-weight: 600; }

@media (max-width: 480px) {
  .auth-body, .auth-head { padding-left: 20px; padding-right: 20px; }
  .auth-footer { padding-left: 20px; padding-right: 20px; }
}
</style>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-head">
      <div class="auth-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="8" r="4"/>
          <path d="M4 21a8 8 0 0 1 16 0"/>
        </svg>
      </div>
      <h1>Capivara Online</h1>
      <p>Acesse sua conta para usar seus créditos de consulta</p>
      <div class="auth-tabs">
        <button class="auth-tab is-active" id="tab-login" onclick="showTab('login')">Entrar</button>
        <button class="auth-tab" id="tab-register" onclick="showTab('register')">Criar conta</button>
      </div>
    </div>

    <div class="auth-body">
      <div id="auth-error" class="auth-error"></div>

      <form id="auth-form" onsubmit="handleSubmit(event)">
        <div class="auth-field">
          <label for="auth-email">E-mail</label>
          <input id="auth-email" type="email" placeholder="seu@email.com" required autocomplete="email">
        </div>
        <div class="auth-field">
          <label for="auth-password">Senha</label>
          <input id="auth-password" type="password" placeholder="••••••••" required minlength="6" autocomplete="current-password">
        </div>
        <div class="auth-field" id="field-name" style="display:none;">
          <label for="auth-name">Nome completo</label>
          <input id="auth-name" type="text" placeholder="Seu nome" autocomplete="name">
        </div>
        <button type="submit" class="auth-submit" id="auth-btn">Entrar</button>
      </form>
    </div>

    <div class="auth-footer">
      <a href="consulta.html">← Voltar para a consulta</a>
    </div>
  </div>
</div>

<script>
  var supabase = window.supabase.createClient(
    window.APP_CONFIG.SUPABASE_URL,
    window.APP_CONFIG.SUPABASE_ANON_KEY
  );

  var activeTab = 'login';

  // Redireciona se já logado
  supabase.auth.getSession().then(function(r) {
    if (r.data.session) {
      var dest = new URLSearchParams(location.search).get('next') || 'consulta.html';
      location.href = dest;
    }
  });

  function showTab(tab) {
    activeTab = tab;
    document.getElementById('tab-login').classList.toggle('is-active', tab === 'login');
    document.getElementById('tab-register').classList.toggle('is-active', tab === 'register');
    document.getElementById('auth-btn').textContent = tab === 'login' ? 'Entrar' : 'Criar conta';
    document.getElementById('field-name').style.display = tab === 'register' ? '' : 'none';
    var pw = document.getElementById('auth-password');
    pw.autocomplete = tab === 'login' ? 'current-password' : 'new-password';
    hideError();
  }

  function showError(msg) {
    var el = document.getElementById('auth-error');
    el.textContent = msg;
    el.style.display = '';
  }
  function hideError() {
    document.getElementById('auth-error').style.display = 'none';
  }

  async function handleSubmit(e) {
    e.preventDefault();
    hideError();
    var btn = document.getElementById('auth-btn');
    btn.disabled = true;
    btn.textContent = 'Aguarde...';

    var email = document.getElementById('auth-email').value.trim();
    var password = document.getElementById('auth-password').value;

    try {
      var result;
      if (activeTab === 'login') {
        result = await supabase.auth.signInWithPassword({ email, password });
      } else {
        var name = document.getElementById('auth-name').value.trim();
        result = await supabase.auth.signUp({
          email, password,
          options: { data: { full_name: name } }
        });
      }

      if (result.error) {
        showError(translateError(result.error.message));
      } else if (activeTab === 'register' && result.data.user && !result.data.session) {
        showError('Conta criada! Verifique seu e-mail para confirmar o cadastro.');
        document.getElementById('auth-error').style.background = 'rgba(31,191,117,.08)';
        document.getElementById('auth-error').style.borderColor = 'rgba(31,191,117,.3)';
        document.getElementById('auth-error').style.color = '#0e7f4e';
      } else {
        var dest = new URLSearchParams(location.search).get('next') || 'consulta.html';
        location.href = dest;
      }
    } catch (err) {
      showError('Erro inesperado. Tente novamente.');
    } finally {
      btn.disabled = false;
      btn.textContent = activeTab === 'login' ? 'Entrar' : 'Criar conta';
    }
  }

  function translateError(msg) {
    if (/invalid login/i.test(msg))            return 'E-mail ou senha incorretos.';
    if (/email not confirmed/i.test(msg))       return 'Confirme seu e-mail antes de entrar.';
    if (/user already registered/i.test(msg))  return 'Este e-mail já está cadastrado. Tente entrar.';
    if (/password.*6/i.test(msg))              return 'A senha deve ter pelo menos 6 caracteres.';
    return msg;
  }
</script>
</body>
</html>
